<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logged Out - DiShiv PayTracker</title>

  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Icons -->
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2845/2845722.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2845/2845722.png">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-primary: #0f172a;
      --accent-primary: #6366f1;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --font-family: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .logout-card {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.9));
      border: 1px solid var(--border-color);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 36px 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .lock-icon {
      width: 64px;
      height: 64px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .logout-card h2 {
      font-size: 20px;
      font-weight: 800;
    }

    .logout-card p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--accent-primary), #4f46e5);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="logout-card">
    <div class="lock-icon">
      <i class="fa-solid fa-lock"></i>
    </div>
    <h2 id="logoutTitle">DiShiv Vault Locked</h2>
    <p id="logoutDesc">Your session token has been revoked and local memory cleared. All budget data is safely encrypted.</p>

    <a href="./login.html" class="primary-btn">
      <i class="fa-solid fa-key"></i> Login Again to Vault
    </a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const reason = urlParams.get('reason');

    if (reason === 'expired') {
      document.getElementById('logoutTitle').innerText = '15-Day Session Expired';
      document.getElementById('logoutDesc').innerText = 'Your 15-day login session has expired for security. Please login again to access your budget vault.';
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - DiShiv PayTracker</title>

  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Icons & Fonts -->
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2845/2845722.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2845/2845722.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="public/css/style.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:#0f172a; color:#fff;">
  <div class="login-card" style="width:100%; max-width:420px; padding:2rem; background:#1e293b; border-radius:1rem; border:1px solid rgba(255,255,255,0.08);">
    <div style="text-align:center; margin-bottom:1.5rem;">
      <div style="width:60px; height:60px; background:linear-gradient(135deg, #6366f1, #8b5cf6); border-radius:1rem; display:inline-flex; align-items:center; justify-content:center; font-size:1.8rem; margin-bottom:0.75rem;">
        <i class="fa-solid fa-vault"></i>
      </div>
      <h1 style="font-size:1.5rem; font-weight:700;">DiShiv PayTracker</h1>
      <p style="color:#94a3b8; font-size:0.9rem;">Authenticated Vault Access</p>
    </div>

    <div id="errorAlert" style="display:none; padding:0.75rem; background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.3); border-radius:0.5rem; color:#fca5a5; font-size:0.85rem; margin-bottom:1rem;"></div>

    <form onsubmit="handleAuthSubmit(event)">
      <div class="form-group" style="margin-bottom:1rem;">
        <label style="display:block; margin-bottom:0.4rem; color:#94a3b8; font-size:0.85rem;">Username</label>
        <input type="text" id="usernameInput" placeholder="e.g. dishiv" required style="width:100%; padding:0.75rem; background:#0f172a; border:1px solid rgba(255,255,255,0.1); border-radius:0.5rem; color:#fff;">
      </div>

      <div class="form-group" style="margin-bottom:1rem;">
        <label style="display:block; margin-bottom:0.4rem; color:#94a3b8; font-size:0.85rem;">Account Role</label>
        <select id="roleInput" style="width:100%; padding:0.75rem; background:#0f172a; border:1px solid rgba(255,255,255,0.1); border-radius:0.5rem; color:#fff;">
          <option value="OWNER">👑 Owner (Disha - Super Admin)</option>
          <option value="USER">👤 User (Shivdattsinh - Standard User)</option>
        </select>
      </div>

      <div class="form-group" style="margin-bottom:1.5rem;">
        <label style="display:block; margin-bottom:0.4rem; color:#94a3b8; font-size:0.85rem;">Password</label>
        <input type="password" id="passwordInput" placeholder="••••••••" required style="width:100%; padding:0.75rem; background:#0f172a; border:1px solid rgba(255,255,255,0.1); border-radius:0.5rem; color:#fff;">
      </div>

      <button type="submit" class="primary-btn" style="width:100%; padding:0.85rem; background:linear-gradient(135deg, #6366f1, #8b5cf6); border:none; border-radius:0.5rem; color:#fff; font-weight:600; cursor:pointer;">
        <i class="fa-solid fa-lock"></i> <span id="submitBtnText">Login to Vault</span>
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="src/config/database.js?v=5"></script>
  <script src="src/services/audit.service.js?v=5"></script>
  <script src="src/services/auth.service.js?v=5"></script>
  <script src="auth.js?v=5"></script>
  <script>
    if (auth.isAuthenticated()) {
      window.location.href = './index.html';
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('usernameInput').value;
      const role = document.getElementById('roleInput').value;
      const password = document.getElementById('passwordInput').value;
      const errorAlert = document.getElementById('errorAlert');

      errorAlert.style.display = 'none';

      try {
        await auth.login(username, password, role);
        window.location.href = './index.html';
      } catch (err) {
        errorAlert.innerText = '❌ ' + err.message;
        errorAlert.style.display = 'block';
      }
    }
  </script>
</body>
</html>
